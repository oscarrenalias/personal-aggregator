[project]
name = "personal-aggregator"
version = "0.1.86"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "testcontainers[postgres]>=4",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-ra -q"
filterwarnings = [
    # Third-party: Starlette plans to drop httpx from TestClient; no code change available without upgrading deps
    "ignore::starlette.testclient.StarletteDeprecationWarning",
    # Third-party: google-genai uses a deprecated typing alias internally
    "ignore:.*_UnionGenericAlias.*is deprecated:DeprecationWarning:google",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
