description: "clusterer.merge prompt vs model accuracy comparison"

# PROMPTFOO_PYTHON must be a single executable path; promptfoo uses execFile(),
# not exec(), so it cannot be a multi-word shell command. The wrapper script
# evals/promptfoo-python.sh delegates to `uv run --all-packages --with openpyxl python`
# so aggregator_clusterer (and all workspace packages) are importable.
# The Makefile sets PROMPTFOO_PYTHON automatically; to run promptfoo directly,
# run from the repo root:
#
#   export PROMPTFOO_PYTHON="./evals/promptfoo-python.sh"
#
# Adding a new provider requires only editing the providers list below.
env:
  PROMPTFOO_PYTHON: "./evals/promptfoo-python.sh"

providers:
  - id: "file://../shared/litellm_provider.py"
    label: terra-none
    config:
      model: gpt-6.1-terra
      params:
        reasoning_effort: none
        max_completion_tokens: 128
        temperature: 0.0
        timeout: 60

  # Reasoning arms: terra only accepts the default temperature (1) when
  # reasoning_effort is not "none", and reasoning tokens count against the
  # completion budget, so temperature is omitted and the budget raised.
  - id: "file://../shared/litellm_provider.py"
    label: terra-low
    config:
      model: gpt-6.1-terra
      params:
        reasoning_effort: low
        max_completion_tokens: 2048
        timeout: 120

  - id: "file://../shared/litellm_provider.py"
    label: terra-medium
    config:
      model: gpt-6.1-terra
      params:
        reasoning_effort: medium
        max_completion_tokens: 2048
        timeout: 120

  - id: "file://../shared/litellm_provider.py"
    label: luna-none
    config:
      model: gpt-6-luna
      params:
        reasoning_effort: none
        max_completion_tokens: 128
        temperature: 0.0
        timeout: 60

prompts:
  - id: "file://prompts.py:merge_v1"
    label: v1
  - id: "file://prompts.py:merge_v2"
    label: v2
  - id: "file://prompts.py:merge_v3"
    label: v3
  - id: "file://prompts.py:merge_v3_deals"
    label: v3-deals
  - id: "file://prompts.py:merge_v4"
    label: v4
  - id: "file://prompts.py:merge_v4b"
    label: v4b

# Test cases are rendered by render_tests.py before this config runs.
# The Makefile handles this automatically via: make eval-merge
tests: "../results/test-cases.yaml"

defaultTest:
  assert:
    - type: python
      value: "file://assert_same_story.py:get_assert"
